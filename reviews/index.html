<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAVOTA - Review QR Card</title>
    <link rel="icon" href="../logo.jpg" type="image/jpeg">
    <style>
        :root {
            --navy: #0d1b3e;
            --cyan: #00d4ff;
            --light: #f7fafc;
            --ink: #1f2937;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(140deg, #f8fbff 0%, #eef6ff 100%);
            font-family: Inter, Arial, sans-serif;
            color: var(--ink);
            padding: 24px;
        }
        .card {
            width: 105mm;
            min-height: 148mm;
            background: #fff;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(13, 27, 62, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14mm 10mm;
            text-align: center;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .brand img {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
        }
        .brand h1 {
            margin: 0;
            font-size: 20px;
            color: var(--navy);
            letter-spacing: 0.4px;
        }
        .brand p {
            margin: 2px 0 0;
            font-size: 12px;
            color: #4b5563;
        }
        .cta {
            margin: 12px 0 8px;
            font-size: 22px;
            font-weight: 800;
            color: var(--navy);
        }
        .sub {
            margin: 0 0 12px;
            font-size: 14px;
            color: #374151;
            max-width: 80%;
            line-height: 1.45;
        }
        #qr {
            width: 280px;
            height: 280px;
            display: grid;
            place-items: center;
            border: 10px solid #fff;
            box-shadow: 0 6px 18px rgba(17, 24, 39, 0.2);
            border-radius: 12px;
            margin: 6px 0 12px;
            background: #fff;
        }
        .open-link {
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: var(--navy);
            color: var(--cyan);
            font-size: 16px;
            font-weight: 700;
            border-radius: 999px;
            padding: 14px 28px;
        }
        .phone {
            margin-top: 10px;
            font-weight: 700;
            color: var(--navy);
            font-size: 14px;
        }
        @media print {
            body {
                padding: 0;
                background: #fff;
            }
            .card {
                box-shadow: none;
                border-radius: 0;
                border: none;
                width: 100%;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <img src="../logo.jpg" alt="PAVOTA logo">
            <div>
                <h1>PAVOTA</h1>
                <p>Plumbing Solutions</p>
            </div>
        </div>

        <p class="cta">Rate Our Service</p>
        <p class="sub">If today's job helped, please scan and leave a quick Google review.</p>

        <div id="qr"></div>

        <a id="review-link" class="open-link" href="#" target="_blank" rel="noopener noreferrer">Open Review Link</a>
        <p class="phone">Hotline: +94 70 111 1994</p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        const REVIEW_URL = "https://g.page/r/CW5uG-cOHZZDEAE/review";

        const qrContainer = document.getElementById("qr");
        const linkEl = document.getElementById("review-link");
        const fallbackQrSrc = "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" + encodeURIComponent(REVIEW_URL);

        linkEl.href = REVIEW_URL;

        function renderFallbackQrImage() {
            const img = document.createElement("img");
            img.src = fallbackQrSrc;
            img.width = 260;
            img.height = 260;
            img.alt = "Google review QR code";
            img.loading = "eager";
            img.decoding = "sync";
            img.onerror = () => {
                qrContainer.textContent = "QR load failed. Use the button below.";
            };
            qrContainer.innerHTML = "";
            qrContainer.appendChild(img);
        }

        if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
            window.QRCode.toCanvas(REVIEW_URL, {
                width: 260,
                margin: 1,
                color: {
                    dark: "#0d1b3e",
                    light: "#ffffff"
                }
            }, (err, canvas) => {
                if (err) {
                    renderFallbackQrImage();
                    return;
                }
                qrContainer.innerHTML = "";
                qrContainer.appendChild(canvas);
            });
        } else {
            // Fallback when jsDelivr is blocked or unavailable.
            renderFallbackQrImage();
        }
    </script>
</body>
</html>
