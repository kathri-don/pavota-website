<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root{--navy:#0d1b3e;--cyan:#00d4ff;--cyan-d:#0094b8;--bg:#f2f6fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e3e8ef;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:8px}
.top .brand{font-weight:900;letter-spacing:.5px;line-height:1}
.top .brand small{display:block;font-weight:600;font-size:10px;color:var(--cyan);letter-spacing:2px;margin-top:3px}
.top .sp{flex:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;background:#9aa5b4;vertical-align:middle}
.dot.synced{background:#22c55e}.dot.pending,.dot.syncing{background:#facc15}.dot.offline{background:#fb923c}.dot.denied,.dot.error,.dot.signedout{background:#ef4444}
.iconbtn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h2{font-size:17px;margin:22px 0 10px;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:18px;color:var(--navy);word-break:break-word}
.stat span{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
input,select,textarea{width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:10px 11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 2px rgba(0,212,255,.35)}
textarea{min-height:70px;resize:vertical}
.btn{text-decoration:none;border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:var(--cyan);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.wa{background:#22a95b;color:#fff}
.btn.ghost{background:transparent;color:var(--navy);border:1px dashed #9fb0c5}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f1b5b5}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.full{width:100%}
.fab{position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:30;box-shadow:0 8px 24px rgba(13,27,62,.35);padding:14px 20px;border-radius:999px}
.job{display:flex;gap:12px;align-items:center;cursor:pointer}
.job .t{font-weight:700;color:var(--navy)}
.job .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .amt{text-align:right;font-weight:700;white-space:nowrap}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;margin-top:4px}
.chip.muted{background:#eef1f5;color:#6b7280}.chip.neutral{background:#e0f7fd;color:#03688a}.chip.info{background:#e6ecff;color:#2741a8}.chip.ok{background:#dcfce7;color:var(--ok)}.chip.warn{background:#fef3c7;color:var(--warn)}.chip.bad{background:#fee2e2;color:var(--bad)}
.seg{display:flex;background:#e8eef6;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fbfcfe}
.item .grid{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:8px;margin-top:2px}
.item .grid{align-items:end}.item .grid>div{min-width:0}
.item .grid label{margin:6px 0 3px;font-size:11px;overflow-wrap:anywhere}
.item .kind{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.kind.material{color:var(--cyan-d)}.kind.labour{color:#7c3aed}
.si{letter-spacing:0;text-transform:none;font-weight:600;opacity:.8}
.grp{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
.item .line{font-size:13px;color:var(--muted);text-align:right;margin-top:6px}
.x{border:0;background:transparent;color:#9aa5b4;font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.totals .grand{border-top:2px solid var(--navy);margin-top:6px;padding-top:8px;font-weight:900;font-size:18px;color:var(--navy)}
.doc{border-left:4px solid var(--cyan)}
.doc h3{margin:0;font-size:15px;color:var(--navy)}
.doc .meta{font-size:13px;color:var(--muted);margin-top:2px}
.pay{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pay.void{opacity:.5;text-decoration:line-through}
.hint{font-size:13px;color:var(--warn);background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:8px 10px;margin-top:10px}
.note{font-size:13px;color:var(--muted)}
.lock{position:fixed;inset:0;z-index:100;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:340px;text-align:center}
.lock img{width:72px;height:72px;border-radius:16px}
.lock h1{font-size:20px;margin:10px 0 2px;color:var(--navy)}
.lock input{text-align:center;font-size:24px;letter-spacing:10px;margin-top:10px}
.lock input::placeholder{font-size:15px;letter-spacing:1px}
.lock .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;z-index:150;background:rgba(13,27,62,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px max(20px,env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style>
</head>
<body>

<div id="gate" class="lock" style="z-index:110">
  <div class="box">
    <img src="icon-192.png" alt="">
    <h1>PAVOTA Office</h1>
    <p class="note" id="gateMsg">Starting…</p>
    <button class="btn full" id="gateBtn" hidden>Sign in with Google</button>
  </div>
</div>

<div id="lock" class="lock" hidden>
  <form class="box" id="lockForm" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>PAVOTA Office</h1>
    <p class="note" id="lockMsg">Enter your PIN</p>
    <input id="pin1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" required>
    <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="Confirm PIN" placeholder="repeat PIN" hidden>
    <div class="err" id="lockErr"></div>
    <button class="btn full" type="submit" id="lockBtn">Unlock</button>
  </form>
</div>

<header class="top">
  <img src="icon-192.png" alt="">
  <div class="brand">PAVOTA<small>OFFICE</small></div>
  <div class="sp"></div>
  <button class="iconbtn" id="navSync" title="Cloud sync">☁<span class="dot" id="syncDot"></span></button>
  <button class="iconbtn" id="navHome" title="Home">Jobs</button>
  <button class="iconbtn" id="navSettings" title="Settings">Settings</button>
  <button class="iconbtn" id="navLock" title="Lock">Lock</button>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
/* =========================================================
   PAVOTA Office — quotations, invoices & receipts
   Opens only after Google sign-in with the allowed account, then the device PIN.
   Works from this device's copy (localStorage) and syncs jobs, settings and
   document numbers through Firebase (see "Cloud sync").
   ========================================================= */

const KEY = 'pavota_office_v1';
const DEFAULTS = {
  business: {
    name: 'PAVOTA Plumbing Solutions',
    tagline: 'PLUMBING SOLUTIONS',
    phone: '+94 70 111 1994',
    email: 'pavotaplumbing@gmail.com',
    web: 'www.pavotaplumbing.lk',
    address: 'Piliyandala, Colombo, Sri Lanka',
    signatory: 'PAVOTA Plumbing Solutions',
    reviewUrl: 'https://g.page/r/CW5uG-cOHZZDEAE/review'
  },
  terms: { validityDays: 7, advancePct: 50, warrantyMonths: 3 }
};

/* ---------- storage ---------- */
let db = load();
function blank() { return { v: 1, settings: JSON.parse(JSON.stringify(DEFAULTS)), security: null, counters: {}, jobs: [], lastBackup: null }; }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.jobs)) return normalise(d);
  } catch (e) {}
  return blank();
}
function normalise(d) {
  d.settings = d.settings || {};
  d.settings.business = Object.assign({}, DEFAULTS.business, d.settings.business || {});
  d.settings.terms = Object.assign({}, DEFAULTS.terms, d.settings.terms || {});
  d.counters = d.counters || {};
  d.jobs.forEach(j => { j.items = j.items || []; j.payments = j.payments || []; });
  return d;
}
function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('Could not save on this device — export a backup now'); }
}
function save() { saveLocal(); pushSoon(); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => r2(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const lkr = n => 'LKR ' + money(n);
// Sinhala for titles and headings, shown as "English / සිංහල" in the app and on PDFs. Edit wording here.
const SI = {
  'Jobs': 'වැඩ', 'Customer': 'පාරිභෝගිකයා', 'Name': 'නම', 'Phone (WhatsApp)': 'දුරකථනය', 'Site address': 'ලිපිනය', 'Job title': 'කාර්යය',
  'Work & materials': 'වැඩ සහ ද්‍රව්‍ය', 'Show materials on documents as': 'ද්‍රව්‍ය පෙන්වන ආකාරය',
  'Materials': 'ද්‍රව්‍ය', 'Material': 'ද්‍රව්‍ය', 'Labour': 'ශ්‍රමය', 'Qty': 'ප්‍රමාණය', 'Unit': 'ඒකකය', 'Rate': 'ඒකක මිල',
  'Discount (LKR)': 'වට්ටම', 'Advance amount (LKR)': 'අත්තිකාරම් මුදල', 'Travel cost (LKR)': 'ප්‍රවාහන ගාස්තු', 'Travel cost': 'ප්‍රවාහන ගාස්තු', 'Notes on documents (scope, exclusions)': 'සටහන්', 'Documents': 'ලේඛන',
  'Quotation': 'මිල ගණන්', 'Invoice': 'ඉන්වොයිසිය', 'Payments & receipts': 'ගෙවීම් සහ රිසිට්පත්', 'Completion date': 'නිම කළ දිනය',
  'Record payment': 'ගෙවීම සටහන් කිරීම', 'Amount (LKR)': 'මුදල', 'Method': 'ක්‍රමය', 'Date': 'දිනය', 'Reference (optional)': 'යොමු අංකය',
  'Backup': 'උපස්ථ', 'Document terms': 'ලේඛන කොන්දේසි', 'Business details on documents': 'ව්‍යාපාර විස්තර', 'Security': 'ආරක්ෂාව', 'Start fresh': 'අලුතින් අරඹන්න',
  // PDF
  'QUOTATION': 'මිල ගණන් පත්‍රය', 'INVOICE': 'ඉන්වොයිසිය', 'PAYMENT RECEIPT': 'ගෙවීම් රිසිට්පත',
  'Prepared for': 'පාරිභෝගිකයා', 'Bill to': 'පාරිභෝගිකයා', 'Received from': 'ගෙවූ තැනැත්තා', 'Job': 'කාර්යය',
  'Description': 'විස්තරය', 'Rate (LKR)': 'ඒකක මිල',
  'Materials & fittings': 'ද්‍රව්‍ය සහ උපාංග', 'Labour & workmanship': 'ශ්‍රම ගාස්තු',
  'Subtotal': 'උප එකතුව', 'Discount': 'වට්ටම', 'TOTAL': 'මුළු එකතුව', 'Advance to confirm': 'අත්තිකාරම', 'Balance on completion': 'ඉතිරි මුදල',
  'Paid to date': 'ගෙවූ මුදල', 'BALANCE DUE': 'ගෙවිය යුතු මුදල', 'Notes': 'සටහන්', 'Terms': 'කොන්දේසි', 'Warranty & terms': 'වගකීම සහ කොන්දේසි',
  'Amount received': 'ලැබුණු මුදල'
};
// key picks the Sinhala; txt is the English shown (defaults to the key)
const bi = (key, txt = key) => SI[key] ? `${esc(txt)} <span class="si">/ ${SI[key]}</span>` : esc(txt);
// a blank (or 0) qty counts as 1, so an item can be priced as a lump, e.g. "PVC 1cm - 20m" at LKR 10,000
const hasQty = i => Number(i.qty) > 0;
const lineAmt = i => r2((hasQty(i) ? Number(i.qty) : 1) * (Number(i.rate) || 0));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function today() { const d = new Date(); return iso(d); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseIso(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function addDays(s, n) { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n) { const d = parseIso(s); const day = d.getDate(); d.setMonth(d.getMonth() + n); if (d.getDate() < day) d.setDate(0); return iso(d); }
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function nice(s) { if (!s) return ''; const d = parseIso(s); return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600); }
// customer phone: 10 digits (e.g. 0771234567); empty is allowed while the job is a draft
const phoneOk = p => !p || /^\d{10}$/.test(p);
function waNumber(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('0') && d.length === 10) d = '94' + d.slice(1);
  else if (d.length === 9 && d.startsWith('7')) d = '94' + d;
  return d;
}
// numbers come from one shared counter in the cloud, so two devices never issue the same number (needs internet)
async function nextNo(prefix, dateStr) {
  const y = (dateStr || today()).slice(0, 4);
  const k = prefix + '-' + y;
  db.counters[k] = await cloudNextNo(k);
  return prefix + '-' + y + '-' + String(db.counters[k]).padStart(3, '0');
}
const noNumber = e => toast(e && e.offline ? 'No internet — connect to issue a document number' : 'Could not get a document number — try again');

/* ---------- money logic ---------- */
function calc(items, discount, travel) {
  let mat = 0, lab = 0;
  (items || []).forEach(i => { const a = lineAmt(i); if (i.kind === 'labour') lab += a; else mat += a; });
  mat = r2(mat); lab = r2(lab);
  const sub = r2(mat + lab), trav = r2(Number(travel) || 0);
  const disc = Math.min(r2(discount), r2(sub + trav));
  return { mat, lab, sub, travel: trav, disc, total: r2(sub + trav - disc) };
}
const jc = j => calc(j.items, j.discount, j.travel);
const liveTotal = j => jc(j).total;
function jobTotal(j) { return j.invoice ? j.invoice.total : j.quote ? j.quote.total : liveTotal(j); }
function paid(j, upToId) {
  let s = 0;
  for (const p of j.payments) { if (!p.void) s += Number(p.amount) || 0; if (upToId && p.id === upToId) break; }
  return r2(s);
}
const balance = j => r2(jobTotal(j) - paid(j));
const quoteExpired = j => j.quote && !j.quote.accepted && !j.invoice && j.quote.validUntil < today();
function status(j) {
  const tot = jobTotal(j);
  if (j.invoice && tot > 0 && balance(j) <= 0.004) return ['Paid', 'ok'];
  if (j.invoice) return ['Invoiced', 'info'];
  if (j.quote && j.quote.accepted) return [paid(j) > 0 ? 'Advance paid' : 'Accepted', 'info'];
  if (j.quote) return quoteExpired(j) ? ['Quote expired', 'warn'] : ['Quoted', 'neutral'];
  return ['Draft', 'muted'];
}
// advance/travel only join the key once set, so quotes issued before they existed don't all show as changed
const snapKey = j => JSON.stringify([j.title, j.items, r2(j.discount), j.materialsMode, j.notes, j.customer]
  .concat(j.advance != null || j.travel ? [{ a: j.advance ?? null, t: r2(j.travel || 0) }] : []));
// advance is optional: only an LKR amount entered on the job counts (0 = no advance, nothing shown on documents).
// Docs issued before advances were per job have no 'advance' field and keep the % they were issued with.
const advOf = (total, x) => 'advance' in x ? Math.min(r2(Number(x.advance) || 0), total) : r2(total * (x.advancePct ?? db.settings.terms.advancePct) / 100);

/* ---------- PIN lock ---------- */
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + ':' + pin);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 2166136261; for (const b of data) { h ^= b; h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16);
}
let failCount = 0, lockUntil = 0, idleTimer;
function showLock() {
  const setup = !db.security;
  $('#lock').hidden = false;
  $('#pin2').hidden = !setup;
  $('#pin2').required = setup;
  $('#lockMsg').textContent = setup ? 'Create a 4–8 digit PIN for this device' : 'Enter your PIN';
  $('#lockBtn').textContent = setup ? 'Set PIN' : 'Unlock';
  $('#pin1').value = ''; $('#pin2').value = ''; $('#lockErr').textContent = '';
  setTimeout(() => $('#pin1').focus(), 50);
}
function lockNow() { try { sessionStorage.removeItem('po_unlocked'); } catch (e) {} showLock(); }
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const p1 = $('#pin1').value.trim(), err = $('#lockErr');
  if (!/^\d{4,8}$/.test(p1)) { err.textContent = 'PIN must be 4–8 digits'; return; }
  if (!db.security) {
    if (p1 !== $('#pin2').value.trim()) { err.textContent = 'PINs do not match'; return; }
    const salt = uid() + uid();
    db.security = { salt, hash: await hashPin(p1, salt) }; save();
  } else {
    if (Date.now() < lockUntil) { err.textContent = 'Too many tries. Wait ' + Math.ceil((lockUntil - Date.now()) / 1000) + 's'; return; }
    if (await hashPin(p1, db.security.salt) !== db.security.hash) {
      failCount++; if (failCount >= 5) { lockUntil = Date.now() + 30000; failCount = 0; }
      err.textContent = 'Wrong PIN'; $('#pin1').value = ''; return;
    }
    failCount = 0;
  }
  try { sessionStorage.setItem('po_unlocked', '1'); } catch (e) {}
  $('#lock').hidden = true; route();
});
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(lockNow, 15 * 60 * 1000); }
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, { passive: true }));

const UNITS = [['nos', 'nos (pieces)'], ['m', 'm (metres)'], ['ft', 'ft (feet)'], ['length', 'length (full pipe)'], ['set', 'set'], ['roll', 'roll'], ['kg', 'kg'], ['l', 'l (litres)'], ['job', 'job'], ['day', 'day'], ['hour', 'hour'], ['visit', 'visit']];

let logoData;
async function getLogo() {
  if (logoData !== undefined) return logoData;
  try {
    const b = await (await fetch('icon-512.png')).blob();
    logoData = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });
  } catch (e) { logoData = null; }

// jsPDF can't shape Sinhala script, so the browser draws it on a canvas (phone's own Sinhala font) and it goes in as an image
const siCache = {};
function siPng(text, sizePt, color, bold) {
  const key = 'si' + [text, sizePt, color, bold].join('|');
  if (siCache[key]) return siCache[key];
  const S = 12, fpx = sizePt * 0.3528 * S; // 12 px per mm ≈ 300 dpi
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const f = `${bold ? 700 : 400} ${fpx}px "Noto Sans Sinhala","Sinhala Sangam MN","Iskoola Pota","Nirmala UI",sans-serif`;
  ctx.font = f;
  c.width = Math.ceil(ctx.measureText(text).width) + 4; c.height = Math.ceil(fpx * 1.8);
  ctx.font = f; ctx.fillStyle = `rgb(${color.join(',')})`; ctx.fillText(text, 1, fpx * 1.2);
  return (siCache[key] = { url: c.toDataURL('image/png'), w: c.width / S, h: c.height / S, base: fpx * 1.2 / S, key });
}
const NAVY = [13, 27, 62], CYAN = [0, 212, 255], CYAND = [0, 130, 165], GRAY = [100, 110, 125], INK = [31, 41, 55], ZEBRA = [243, 247, 252], LINE = [220, 226, 234];

  // "English / සිංහල" in the current font; key picks the Sinhala, txt is the English shown
  const bi = (key, x, yy, align, txt = key) => {
    const si = SI[key], head = si ? txt + ' / ' : txt;

    const img = si && siPng(si, cur.size * 1.05, cur.color, cur.style === 'bold');
    const x0 = align === 'right' ? x - tw - (img ? img.w : 0) : x;

function fmtQty(q) { q = Number(q) || 0; return Number.isInteger(q) ? String(q) : String(r2(q)); }
function drawQr(doc, text, x, y, size) {

/* ---------- share / view ---------- */
function fileName(type, j, pay) {
  const no = type === 'quote' ? j.quote.no : type === 'invoice' ? j.invoice.no : pay.no;
  const kind = type === 'quote' ? 'Quotation' : type === 'invoice' ? 'Invoice' : 'Receipt';
  return `PAVOTA-${kind}-${no}.pdf`;
}
function message(type, j, pay) {
  const T = db.settings.terms, B = db.settings.business;
  const first = (j.customer.name || '').trim().split(/\s+/)[0] || 'there';
  if (type === 'quote') {
    const q = j.quote;
    return `Hello ${first}, thank you for contacting PAVOTA Plumbing Solutions.\n\nPlease find attached quotation ${q.no}${q.rev > 1 ? ' (Rev ' + q.rev + ')' : ''}${q.title ? ' for ' + q.title : ''}.\nTotal: LKR ${money(q.total)}\nValid until: ${nice(q.validUntil)}\n\n${advOf(q.total, q) ? `To confirm the booking, an advance of LKR ${money(advOf(q.total, q))} is required. ` : ''}Reply here to accept and we will share our bank details.`;
  }
  if (type === 'invoice') {
    const i = j.invoice, bal = Math.max(0, i.total - paid(j));
    return `Hello ${first}, thank you for choosing PAVOTA Plumbing Solutions.\n\nPlease find attached invoice ${i.no}.\nTotal: LKR ${money(i.total)}\nBalance due: LKR ${money(bal)}`;
  }
  const bal = r2(jobTotal(j) - paid(j, pay.id));
  return `Hello ${first}, we have received your payment of LKR ${money(pay.amount)}. Thank you!\nReceipt ${pay.no} is attached.` +
    (bal > 0.004 ? `\nBalance remaining: LKR ${money(bal)}` : `\n\nIf you were happy with our work, a quick Google review would mean a lot:\n${B.reviewUrl}`);
}
async function viewDoc(type, j, pay) {
  const w = window.open('', '_blank');
  try {
    const doc = await buildPdf(type, j, pay);
    const url = URL.createObjectURL(doc.output('blob'));
    if (w) w.location.href = url; else location.href = url;
  } catch (e) { if (w) w.close(); toast(e.message); }
}
async function shareDoc(type, j, pay) {
  let doc;
  try { doc = await buildPdf(type, j, pay); } catch (e) { return toast(e.message); }
  const name = fileName(type, j, pay);
  const blob = doc.output('blob');
  const text = message(type, j, pay);
  let file = null;
  try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name, text }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // Fallback (desktop / older phones): download the PDF, then open the customer's WhatsApp chat with the message ready.
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  const num = waNumber(j.customer.phone);
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="sheet"><h2 style="margin-top:0">PDF downloaded</h2>
    <p class="note">${esc(name)} is in your downloads. Open WhatsApp, then attach the PDF to the chat.</p>
    <div class="btns">${num ? `<a class="btn wa grow" target="_blank" rel="noopener" href="https://wa.me/${num}?text=${encodeURIComponent(text)}">Open WhatsApp chat</a>` : '<span class="note">Add the customer phone to open their chat directly.</span>'}
    <button class="btn alt" data-close>Done</button></div></div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m || e.target.dataset.close !== undefined) m.remove(); };
}

    <div class="row"><button class="btn ghost sm" id="back">← Jobs</button></div>
    <h2>Cloud sync</h2>
    <div class="card" id="cloudCard">${cloudCardHtml()}</div>
    <h2>${bi('Backup')}</h2>
    <div class="card">
      <p class="note" style="margin-top:0">${cloud.user ? 'Your records sync to the cloud. A backup file is still a good extra copy now and then.' : 'Your quotes, invoices and receipts are stored only on this phone. Export a backup every week and keep it in Google Drive or email it to yourself.'}
      ${db.lastBackup ? '<br>Last backup: ' + nice(iso(new Date(db.lastBackup))) : '<br><b>No backup yet.</b>'}</p>
      <div class="btns"><button class="btn" id="exp">Export backup</button><button class="btn alt" id="imp">Restore from backup</button></div>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
    </div>
    <h2>${bi('Document terms')}</h2>
    <div class="card">
      ${f('t.validityDays', 'Quotation valid for (days)', T.validityDays, 'number')}
      ${f('t.warrantyMonths', 'Workmanship warranty (months)', T.warrantyMonths, 'number')}
    </div>
    <h2>${bi('Business details on documents')}</h2>
    <div class="card">
      ${f('b.phone', 'Phone', B.phone)}${f('b.email', 'Email', B.email)}${f('b.web', 'Website', B.web)}${f('b.address', 'Address line', B.address)}
      ${f('b.signatory', 'Authorised by', B.signatory)}${f('b.reviewUrl', 'Google review link (QR on final receipts)', B.reviewUrl, 'url')}
    </div>
    <h2>${bi('Security')}</h2>
    <div class="card">
      <p class="note" style="margin-top:0">The app locks after 15 minutes idle. Changing the PIN does not affect your records.</p>
      <div class="btns"><button class="btn alt" id="chPin">Change PIN</button></div>
    </div>
    <h2>${bi('Start fresh')}</h2>
    <div class="card">
      <p class="note" style="margin-top:0">Deletes every job and resets numbering to 001 (for example after testing). Your PIN and settings stay. Export a backup first if you might need the records.</p>
      <div class="btns"><button class="btn danger" id="wipe">Erase all jobs & reset numbers</button></div>
    </div>
    <p class="note" style="text-align:center">PAVOTA Office · ${db.jobs.length} job(s)${cloud.user ? '' : ' on this device'}</p>`;
  $('#back').onclick = () => go('');
  bindCloudCard();
  app.querySelectorAll('[data-s]').forEach(el => el.addEventListener('change', () => {
    const [g, k] = el.dataset.s.split('.');
    const target = g === 't' ? db.settings.terms : db.settings.business;
    if (g === 't') { const v = Number(el.value); if (!(v > 0)) { toast('Enter a number above 0'); el.value = target[k]; return; } target[k] = v; }
    else target[k] = el.value.trim();
    db.settingsUpdated = Date.now(); save(); toast('Saved');
  }));
  $('#exp').onclick = exportBackup;
  $('#imp').onclick = () => $('#impFile').click();
  $('#impFile').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!d || !Array.isArray(d.jobs)) throw new Error('bad');
      if (!confirm(`Replace everything on this phone with the backup (${d.jobs.length} jobs)?`)) return;
      const sec = db.security;
      const epoch = db.counterEpoch;
      db = normalise(d); db.security = sec || db.security; db.counterEpoch = epoch; db.settingsUpdated = Date.now();
      save(); liftCounters(); toast('Backup restored'); renderSettings();
    } catch (err) { toast('That file is not a PAVOTA Office backup'); }
    e.target.value = '';
  };
  $('#wipe').onclick = () => {
    if (!confirm('Erase ALL ' + db.jobs.length + ' job(s)' + (cloud.user ? ' on every device' : '') + ' and reset document numbers to 001?')) return;
    if (prompt('Type ERASE to confirm') !== 'ERASE') return toast('Nothing was erased');
    db.jobs = []; db.counters = {}; db.lastBackup = null;
    if (cloud.user) resetCloudCounters();
    save(); toast('All jobs erased'); renderSettings();
  };
  $('#chPin').onclick = () => { if (confirm('Set a new PIN now?')) { db.security = null; save(); lockNow(); } };
}
function exportBackup() {
  const data = JSON.stringify(db, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = 'pavota-office-backup-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  db.lastBackup = Date.now(); save(); toast('Backup saved to downloads');
  if (!location.hash) renderHome();
}

/* =========================================================
   Cloud sync (Firebase Auth + Firestore)
   - jobs/{id}: { json, updated } one doc per job; the newer 'updated' wins
   - meta/settings: { json, updated }
   - meta/counters: { epoch, 'PQ-2026': n, ... } shared document numbers
   localStorage stays the working copy; Firestore's own offline cache queues writes made without signal.
   Who may read/write is enforced by Firestore security rules (allowed Google accounts only).
   ========================================================= */
const FB_CONFIG = {
  apiKey: 'AIzaSyDErd-YNMYeqkaq87obOJym3iMMZyrx5Qs',
  authDomain: 'pavota-plumbing.firebaseapp.com',
  projectId: 'pavota-plumbing',
  storageBucket: 'pavota-plumbing.firebasestorage.app',
  messagingSenderId: '759575724430',
  appId: '1:759575724430:web:cb462e9baef395a47264df'
};
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const SYNC_KEY = KEY + '_sync';
const cloud = { state: 'loading', user: null, m: null, auth: null, fs: null, unsub: [], lastJson: {}, known: new Set(), jobsReady: false, settingsReady: false, settingsJson: null };
// ids this device has seen in the cloud: one that later disappears was deleted on another device
try { cloud.known = new Set((JSON.parse(localStorage.getItem(SYNC_KEY)) || {}).known || []); } catch (e) {}
const saveSyncState = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ known: [...cloud.known] })); } catch (e) {} };
const SYNC_TEXT = { loading: 'Starting…', signedout: 'Not signed in. Records are only on this device.', syncing: 'Syncing…', pending: 'Saving changes to the cloud…', synced: 'All changes synced', offline: 'Offline. Changes will sync when you are back online.', denied: 'This Google account is not allowed to use PAVOTA Office.', error: 'Cloud sync is not available right now.' };
function setSync(state) {
  cloud.state = state;
  const d = $('#syncDot'); if (d) { d.className = 'dot ' + state; $('#navSync').title = SYNC_TEXT[state]; }
  const c = $('#cloudCard'); if (c) { c.innerHTML = cloudCardHtml(); bindCloudCard(); }
}
function cloudCardHtml() {
  return `<p class="note" style="margin-top:0"><span class="dot ${cloud.state}" style="margin:0 6px 0 0"></span>${SYNC_TEXT[cloud.state]}${cloud.user ? '<br>Signed in as <b>' + esc(cloud.user.email) + '</b>' : ''}</p>
    <div class="btns">${cloud.user ? '<button class="btn alt" id="signOut">Sign out of this device</button>' : ''}</div>
    ${cloud.user ? '<p class="note">Signing out removes the jobs from this device. They stay safe in the cloud and come back when you sign in again.</p>' : ''}`;
}
function bindCloudCard() {
  const o = $('#signOut'); if (o) o.onclick = () => { if (confirm('Sign out and remove the jobs from this device?')) signOutAndWipe(); };
}
async function cloudInit() {
  try {
    const [a, au, f] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(x => import(FB_SDK + x)));
    cloud.m = { ...au, ...f };
    const fapp = a.initializeApp(FB_CONFIG);
    cloud.auth = au.getAuth(fapp);
    try { cloud.fs = f.initializeFirestore(fapp, { localCache: f.persistentLocalCache({ tabManager: f.persistentMultipleTabManager() }) }); }
    catch (e) { cloud.fs = f.getFirestore(fapp); }
    au.onAuthStateChanged(cloud.auth, u => {
      cloudStop(); cloud.user = u;
      if (u) { try { localStorage.setItem(SIGNED_KEY, '1'); } catch (e) {} cloudStart(); passGate(); }
      else { setSync('signedout'); showGate(cloud.denied ? 'That Google account is not allowed. Sign in with the PAVOTA account.' : 'Sign in with the PAVOTA Google account to open the office.', true); }
    });
  } catch (e) {
    setSync('error');
    // no signal and the SDK isn't cached: a device that has signed in before may open its own copy (PIN still required)
    if (wasSignedIn()) passGate(); else showGate('Cannot reach Google sign-in. Connect to the internet and reload.', false);
  }
}
/* ---------- sign-in gate: Google account first, then the device PIN ---------- */
const SIGNED_KEY = KEY + '_signed';
const wasSignedIn = () => { try { return localStorage.getItem(SIGNED_KEY) === '1'; } catch (e) { return false; } };
function showGate(msg, withBtn) {
  $('#gate').hidden = false; $('#lock').hidden = true;
  $('#gateMsg').textContent = msg; $('#gateBtn').hidden = !withBtn;
}
function passGate() {
  $('#gate').hidden = true;
  let unlocked = false; try { unlocked = sessionStorage.getItem('po_unlocked') === '1'; } catch (e) {}
  if (unlocked && db.security) { route(); resetIdle(); } else showLock();
}
$('#gateBtn').onclick = () => { cloud.denied = false; cloudSignIn(); };
async function signOutAndWipe() {
  const { waitForPendingWrites, terminate, clearIndexedDbPersistence, signOut } = cloud.m;
  try { await withTimeout(waitForPendingWrites(cloud.fs), 8000); }
  catch (e) { if (!confirm('Some changes have not reached the cloud yet (no internet?). Sign out anyway and lose them?')) return; }
  await signOut(cloud.auth);
  db.jobs = []; db.counters = {}; delete db.counterEpoch; db.lastBackup = null; saveLocal();
  try { localStorage.removeItem(SYNC_KEY); localStorage.removeItem(SIGNED_KEY); sessionStorage.removeItem('po_unlocked'); } catch (e) {}
  try { await terminate(cloud.fs); await clearIndexedDbPersistence(cloud.fs); } catch (e) {}
  location.reload();
}
async function cloudSignIn() {
  const { GoogleAuthProvider, signInWithPopup, signInWithRedirect } = cloud.m;
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  try { await signInWithPopup(cloud.auth, p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return signInWithRedirect(cloud.auth, p);
    if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast('Sign-in failed (' + (e.code || 'error') + ')');
  }
}
function cloudStart() {
  const { collection, doc, onSnapshot } = cloud.m;
  setSync('syncing');
  cloud.unsub = [
    onSnapshot(collection(cloud.fs, 'jobs'), { includeMetadataChanges: true }, pullJobs, cloudErr),
    onSnapshot(doc(cloud.fs, 'meta', 'settings'), pullSettings, cloudErr),
    onSnapshot(doc(cloud.fs, 'meta', 'counters'), pullCounters, cloudErr)
  ];
  refreshView();
}
function cloudStop() {
  cloud.unsub.forEach(u => u()); cloud.unsub = [];
  cloud.jobsReady = cloud.settingsReady = false; cloud.lastJson = {}; cloud.settingsJson = null;
}
function cloudErr(e) {
  if (e && e.code === 'permission-denied') { cloud.denied = true; setSync('denied'); cloud.m.signOut(cloud.auth); return; }
  setSync(navigator.onLine ? 'error' : 'offline');
}
const editing = () => { const a = document.activeElement; return a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
// re-draw after changes arrive from another device, without yanking the screen away mid-typing
function refreshView(changedIds) {
  if (!$('#lock').hidden || !$('#gate').hidden) return;
  const h = location.hash;
  if (h.startsWith('#job/')) {
    const id = h.slice(5);
    if (changedIds && !changedIds.has(id)) return;
    if (!db.jobs.some(x => x.id === id)) { toast('This job was deleted on another device'); return go(''); }
    if (!changedIds) return;
    if (editing()) return toast('Job updated on another device');
    return renderJobKeepScroll(db.jobs.find(x => x.id === id));
  }
  if (h === '#settings') return editing() ? null : renderSettings();
  if (!editing()) renderHome();
}
function pullJobs(snap) {
  const remote = new Map(), changed = new Set();
  snap.docs.forEach(d => { try { remote.set(d.id, JSON.parse(d.data().json)); } catch (e) {} });
  remote.forEach((rj, id) => {
    cloud.lastJson[id] = JSON.stringify(rj);
    cloud.known.add(id);
    rj.items = rj.items || []; rj.payments = rj.payments || [];
    const lj = db.jobs.find(x => x.id === id);
    if (!lj) { db.jobs.push(rj); changed.add(id); }
    // update in place so a job screen that is open keeps editing the same object
    else if ((rj.updated || 0) > (lj.updated || 0)) { Object.keys(lj).forEach(k => delete lj[k]); Object.assign(lj, rj); changed.add(id); }
  });
  // only trust absences in a fresh server answer, never in a (possibly empty) offline cache
  if (!snap.metadata.fromCache) {
    db.jobs = db.jobs.filter(j => { const gone = !remote.has(j.id) && cloud.known.has(j.id); if (gone) changed.add(j.id); return !gone; });
    cloud.known = new Set([...cloud.known].filter(id => remote.has(id)));
  }
  cloud.jobsReady = true;
  saveLocal(); saveSyncState(); pushNow();
  setSync(snap.metadata.hasPendingWrites ? 'pending' : snap.metadata.fromCache ? 'offline' : 'synced');
  if (changed.size) refreshView(changed);
}
function pullSettings(s) {
  const d = s.exists() ? s.data() : null;
  if (d && (d.updated || 0) > (db.settingsUpdated || 0)) {
    try { db.settings = normalise({ jobs: [], settings: JSON.parse(d.json) }).settings; db.settingsUpdated = d.updated; saveLocal(); if (location.hash === '#settings' && !editing()) renderSettings(); } catch (e) {}
  }
  cloud.settingsJson = d ? d.json : '';
  cloud.settingsReady = true; pushNow();
}
function pullCounters(s) {
  const d = s.exists() ? s.data() : {};
  // "Erase all jobs" on another device starts a new epoch: drop the old local numbers
  if ((d.epoch || 0) > (db.counterEpoch || 0)) { db.counters = {}; db.counterEpoch = d.epoch; }
  let up = false, higher = false;
  Object.keys(d).forEach(k => { if (k !== 'epoch' && (d[k] || 0) > (db.counters[k] || 0)) { db.counters[k] = d[k]; up = true; } });
  Object.keys(db.counters).forEach(k => { if ((db.counters[k] || 0) > (d[k] || 0)) higher = true; });
  if (up) saveLocal();
  if (higher) liftCounters(); // first sync from a device with older local numbers: never reuse them
}
let pushTimer;
function pushSoon() { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 600); }
function pushNow() {
  if (!cloud.user || !cloud.jobsReady) return;
  const { doc, setDoc, deleteDoc } = cloud.m, ids = new Set();
  db.jobs.forEach(j => {
    ids.add(j.id);
    const json = JSON.stringify(j);
    if (cloud.lastJson[j.id] === json) return;
    cloud.lastJson[j.id] = json; cloud.known.add(j.id);
    setDoc(doc(cloud.fs, 'jobs', j.id), { json, updated: j.updated || Date.now() }).catch(cloudErr);
  });
  Object.keys(cloud.lastJson).forEach(id => {
    if (ids.has(id)) return;
    delete cloud.lastJson[id]; cloud.known.delete(id);
    deleteDoc(doc(cloud.fs, 'jobs', id)).catch(cloudErr);
  });
  if (cloud.settingsReady) {
    const json = JSON.stringify(db.settings);
    if (json !== cloud.settingsJson) { cloud.settingsJson = json; setDoc(doc(cloud.fs, 'meta', 'settings'), { json, updated: db.settingsUpdated || Date.now() }).catch(cloudErr); }
  }
  saveSyncState();
}
const counterRef = () => cloud.m.doc(cloud.fs, 'meta', 'counters');
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('timeout'), { offline: true })), ms))]);
async function cloudNextNo(k) {
  if (!cloud.user || !navigator.onLine) throw Object.assign(new Error('offline'), { offline: true });
  return withTimeout(cloud.m.runTransaction(cloud.fs, async t => {
    const s = await t.get(counterRef()), d = s.exists() ? s.data() : {};
    const local = (d.epoch || 0) === (db.counterEpoch || 0) ? (db.counters[k] || 0) : 0;
    const n = Math.max(d[k] || 0, local) + 1;
    t.set(counterRef(), { [k]: n }, { merge: true });
    return n;
  }), 12000).catch(e => { throw e.offline || e.code === 'unavailable' ? Object.assign(e, { offline: true }) : e; });
}
function liftCounters() {
  if (!cloud.user || !navigator.onLine) return;
  cloud.m.runTransaction(cloud.fs, async t => {
    const s = await t.get(counterRef()), d = s.exists() ? s.data() : {};
    if ((d.epoch || 0) !== (db.counterEpoch || 0)) return;
    const up = {};
    Object.keys(db.counters).forEach(k => { if ((db.counters[k] || 0) > (d[k] || 0)) up[k] = db.counters[k]; });
    if (Object.keys(up).length) t.set(counterRef(), up, { merge: true });
  }).catch(() => {});
}
function resetCloudCounters() {
  db.counterEpoch = Date.now();
  cloud.m.setDoc(counterRef(), { epoch: db.counterEpoch }).catch(cloudErr);
}

/* ---------- start ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
cloudInit();
</script>
